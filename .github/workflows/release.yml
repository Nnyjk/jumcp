name: Release

# 触发：默认分支 push（产出 latest + main）、版本 tag（semver）、手动。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 发布只读仓库内容，镜像推到 GHCR；attestations/id-token 供 provenance 与 SBOM 签名。
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

# 发布不取消：一次 tag 推送必须完整跑到「发布后 digest 回拉冒烟」结束。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build & publish ghcr.io image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # 镜像名必须小写；owner 可能含大写（如 Nnyjk），这里统一归一化。
      - name: Resolve image name
        id: image
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/jumcp" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          # branch / sha / semver；latest 只给默认分支（tag 推送不覆盖 latest）。
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=jumcp
            org.opencontainers.image.description=jumcp MCP 聚合 router：Rust 后端 + 同源管理台静态资源
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=jumcp-image
          cache-to: type=gha,mode=max,scope=jumcp-image
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

      # 发布门禁：回拉刚推送的 digest 再跑一遍同一冒烟脚本；失败即发布失败。
      - name: Pull pushed image by digest
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
        run: |
          echo "pulling $IMAGE_REF"
          docker pull "$IMAGE_REF"

      - name: Smoke published image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
        run: bash scripts/smoke-image.sh "$IMAGE_REF"

      - name: Publish summary
        run: |
          {
            echo "### jumcp image published"
            echo
            echo "- image: \`${{ steps.image.outputs.ref }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- tags: \`${{ steps.meta.outputs.version }}\`（完整列表见构建日志）"
          } >> "$GITHUB_STEP_SUMMARY"
