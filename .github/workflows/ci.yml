name: CI

# 触发：dev（默认分支/集成分支）push、PR（目标 dev 或 main）、手动。
# main 上的日常改动一律经 dev → main 的发版 PR 进入，因此 CI 不订阅 main push，
# 避免与 release.yml 在同一 ref 上重复跑一遍全量校验。
# 目标为 main 的 PR 额外跑 release source is dev：main 只接受 dev 的发版 PR。
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# 最小权限：CI 只读仓库内容（不 push 镜像、不写包）。
permissions:
  contents: read

# 同一分支/PR 的旧运行自动取消，避免排队占满 runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- 后端
  backend:
    name: backend (fmt / clippy / test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          # 与 image job 的 Release 构建分开缓存，避免 debug/release 互相淘汰。
          key: backend-debug

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------- 管理台
  web:
    name: web (lint / typecheck / build / headless smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 产物校验：dist 必须真的能作为静态站点提供（/ 200、/review SPA 回退、hashed JS 可取）。
      # 该 job 默认工作在 admin-web，这一步必须回到仓库根才能按相对路径调用脚本。
      - name: Headless web smoke
        working-directory: ${{ github.workspace }}
        run: bash scripts/smoke-headless-web.sh

      - name: Upload admin-web dist
        uses: actions/upload-artifact@v4
        with:
          name: jumcp-admin-web-headless
          path: admin-web/dist
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- 脚本
  # scripts/ 被 CI、release 与本地共同调用：语法错误或发布 tag 规则错误会直接毁掉一次发版。
  scripts:
    name: scripts (bash -n / release tags)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
            echo "ok $f"
          done

      # 发布 tag 解析不依赖网络与 docker：main / v1.2.3 / v0.0.1.000 / 非法格式都在这里断言。
      - name: Release tag resolution
        run: bash scripts/test-release-tags.sh

  # ---------------------------------------------------------------- 容器镜像
  image:
    name: image (linux/amd64 build / smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 后端或管理台先挂掉时不必再烧一次 90 分钟的镜像构建；
    # 镜像仍从仓库源码各自重编（不消费上游 artifact），依赖关系只影响排队顺序。
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 只解析不部署：验证 deploy/portainer-stack.yml 落在 Swarm 接受的 compose 子集内
      # （例如 `platform` 会被 stack config 拒绝，平台靠 placement constraints 表达）。
      # dummy token 只满足 `${JUMCP_ADMIN_TOKENS:?…}` 的 fail-fast，不是真实凭证。
      - name: Validate stack file
        env:
          JUMCP_ADMIN_TOKENS: ci-placeholder
        run: docker stack config -c deploy/portainer-stack.yml > /dev/null

      # 只构建本地镜像（load），不登录、不 push：发布由 release.yml 负责。
      # provenance/sbom 在 load 模式下不可用，显式关闭。
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: jumcp:ci
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=jumcp-image
          cache-to: type=gha,mode=max,scope=jumcp-image
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}

      - name: Smoke image
        run: bash scripts/smoke-image.sh jumcp:ci

      - name: Save image as artifact
        run: docker save jumcp:ci | gzip -1 > jumcp-linux-amd64-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: jumcp-linux-amd64-image
          path: jumcp-linux-amd64-image.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- 依赖审查（仅 PR）
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR 评论需要 pull-requests: write；其余权限不下放。
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------- 发版来源（仅 main 的 PR）
  # main 只接受 dev 的发版 PR；feature/* 必须先进 dev，不能直接 PR 到 main。
  # 该 job 只在 target 为 main 的 PR 上出现，PR 到 dev 时整体跳过。
  release-source:
    name: release source is dev
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert head branch is dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "dev" ]; then
            echo "发版来源分支是 dev，允许合并到 main"
          else
            echo "::error::main 只接受 dev 的发版 PR（当前来源分支：'$HEAD_REF'）；feature 分支请先 PR 到 dev"
            exit 1
          fi
