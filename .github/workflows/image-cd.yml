name: Image CD

# 镜像发布：dev 推 GHCR 快照，main 推正式版本，v* tag 推版本 tag。
# 校验流水线（ci.yml）不发布；这里只做「构建 → 推送 → 按 digest 回拉冒烟」。
#
# 三道来源防线（workflow_dispatch 可以选择任意 ref）：
#   1) push 触发器只订阅 dev/main 与 v* tag；
#   2) job 级 if 再次限定 ref 只能是 dev、main 或 v* tag，其它 ref 整 job 跳过；
#   3) tag 必须指向 main 历史（merge-base --is-ancestor），否则拒绝发布。
# tag 名格式（v + 3/4 段数字）与分支规则统一由 scripts/release-tags.sh 决定。
on:
  push:
    branches: [dev, main]
    tags: ['v*']
  workflow_dispatch:

# 推镜像到 GHCR；attestations/id-token 供 provenance 与 SBOM 签名；仓库内容只读。
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

# 发布不取消：一次 tag 推送必须完整跑到「发布后 digest 回拉冒烟」结束。
concurrency:
  group: image-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build & publish ghcr.io image
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # 需要完整历史：tag 发布要跑 merge-base 判断祖先关系。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 镜像名必须小写；owner 可能含大写（如 Nnyjk），这里统一归一化。
      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "ref=ghcr.io/${OWNER,,}/jumcp" >> "$GITHUB_OUTPUT"

      # 唯一的 tag/版本规则来源（scripts/release-tags.sh），本地可用同一脚本复算：
      #   dev push   → version=dev，tags=dev,sha-<7 位>（快照，不带 latest）
      #   main push  → version=main，tags=latest,main,sha-<7 位>
      #   v1.2.3     → version=1.2.3，tags=1.2.3,1.2,sha-<7 位>
      #   v0.0.1.000 → version=0.0.1.000，tags=0.0.1.000,0.0.1,0.0,sha-<7 位>
      # 非法 tag 格式、非 dev/main 分支在这里直接失败，不构建镜像。
      - name: Compute version & tags
        id: meta
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: bash scripts/release-tags.sh --image "$IMAGE" --github-output

      # tag 发布必须打在 main 的发布提交上：dev 上打 v* tag 不能绕过「只有 main 发正式版」。
      # origin/main 在 fetch 之后才保证是远端最新引用，所以先 fetch 再判祖先关系。
      - name: Verify tag is on main history
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF 指向 $GITHUB_SHA，在 origin/main 历史内，允许发布"
          else
            echo "::error::tag $GITHUB_REF 指向的提交不在 origin/main 历史内，拒绝发布；发布 tag 必须打在 main 上"
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=jumcp
            org.opencontainers.image.description=jumcp MCP 聚合 router：Rust 后端 + 同源管理台静态资源
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=jumcp-image
          cache-to: type=gha,mode=max,scope=jumcp-image
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

      # 发布门禁：回拉刚推送的 digest 再跑一遍同一冒烟脚本；失败即发布失败。
      - name: Pull pushed image by digest
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
        run: |
          echo "pulling $IMAGE_REF"
          docker pull "$IMAGE_REF"

      - name: Smoke published image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
        run: bash scripts/smoke-image.sh "$IMAGE_REF"

      - name: Publish summary
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### jumcp image published"
            echo
            echo "- image: \`$IMAGE\`"
            echo "- digest: \`$DIGEST\`"
            echo "- version: \`$VERSION\`"
            echo "- tags:"
            printf '%s\n' "$TAGS" | tr ',' '\n' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
