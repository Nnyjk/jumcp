[package]
name = "jumcp-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "jumcp_core"
path = "src/lib.rs"

[dependencies]
jumcp-sqlguard = { path = "../jumcp-sqlguard" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"], default-features = false }
toml = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.11"
aes-gcm = "0.10"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
