[package]
name = "jumcp-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "jumcp-server"
path = "src/main.rs"

[lib]
name = "jumcp_server"
path = "src/lib.rs"

[dependencies]
jumcp-core = { path = "../jumcp-core" }
jumcp-sqlguard = { path = "../jumcp-sqlguard" }
jumcp-connector-clickhouse = { path = "../jumcp-connector-clickhouse" }
jumcp-mcp-clickhouse = { path = "../jumcp-mcp-clickhouse" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"], default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "io-std", "time", "process"] }
axum = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# 上游 MCP 客户端：axum 只提供服务端，hyper 不能直接当 client；rustls 避免引入 openssl。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 管理台静态托管：ServeDir/ServeFile 负责路径解析（穿越防护由上游实现，不手写拼接）。
tower-http = { version = "0.6", features = ["fs"] }
# ServeDir 只有 Service 实现，调用 static 资源需要 ServiceExt::oneshot。
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
