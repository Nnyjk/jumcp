[package]
name = "jumcp-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "jumcp-server"
path = "src/main.rs"

[lib]
name = "jumcp_server"
path = "src/lib.rs"

[dependencies]
jumcp-core = { path = "../jumcp-core" }
jumcp-sqlguard = { path = "../jumcp-sqlguard" }
jumcp-connector-protocol = { path = "../jumcp-connector-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"], default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "io-std", "time", "process"] }
axum = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# 上游 MCP 客户端：axum 只提供服务端，hyper 不能直接当 client；rustls 避免引入 openssl。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.37", features = ["bundled"] }
