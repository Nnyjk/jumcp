# 租户策略（W1.2 / W1.8）：组注册表 + 角色映射 + 预算上限。
# 数据源只引用进程环境变量名，绝不写明文连接串（W1.8 凭证不落配置）。
# groups_mode=intersect 须另行在租户级开启 allow_intersect=true 且必须带 degraded 标记，
# 默认严格模式（D1）。
# 组/角色都用 code + name 双轨：code 是权限标识（scope/token/审计/能力分组一律用它），
# name 只是中文展示名，不参与任何权限判定。
# 兼容旧配置：`[[groups]]` 只写 name 时该 name 当 code，展示名回退 code。
# 注意：[roles] 与 tenant_* 顶层键必须在 [[groups]] 之前声明，
# 否则 tomllib 会把它们都归到最后一个 [[groups]] 表下而被校验拒掉。

tenant_budget_cap = 2000
allow_intersect = false

[roles.analyst]
name = "数据分析"
default_groups = ["db.read.core", "db.read.analytics", "api.internal.read", "kb.search"]
default_budget = 2000

[roles.executor]
name = "执行器"
default_groups = ["db.read.core"]
default_budget = 1600

[roles.admin]
name = "管理员"
# 组 "admin" 是维护通道（admin_* 内置工具）的开关：只有它的成员才看得见/调得动。
default_groups = ["admin"]
default_budget = 2500

[[groups]]
code = "db.read.core"
name = "核心数据只读"
priority = 10
min_budget = 800

[[groups]]
code = "db.read.analytics"
name = "分析数据只读"
priority = 8
min_budget = 800

[[groups]]
code = "db.read.sensitive"
name = "敏感数据只读"
priority = 5
min_budget = 800

[[groups]]
code = "db.admin.schema"
name = "库表管理"
priority = 1
min_budget = 800

# 维护通道：MCP 面 admin_* 内置工具只在 scope.groups 含该组时可见可调（§4.4.6）。
[[groups]]
code = "admin"
name = "管理员通道"
priority = 1
min_budget = 800

[[groups]]
code = "api.internal.read"
name = "内部接口只读"
priority = 6
min_budget = 800

[[groups]]
code = "kb.search"
name = "知识库检索"
priority = 6
min_budget = 800
